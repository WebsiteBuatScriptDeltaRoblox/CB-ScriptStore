<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CB ScriptStore Raw</title><style>:root{color-scheme:dark}body{margin:0;min-height:100vh;background:#030814;color:#dcecff}pre{white-space:pre-wrap;word-break:break-word;padding:24px;margin:0;line-height:1.7;font:14px/1.7 ui-monospace,SFMono-Regular,Consolas,monospace;max-width:1100px;margin:auto}</style></head><body><pre id="code">Loading...</pre><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>(async()=>{const raw=(localStorage.getItem('cb_lang')||navigator.language||'en').toLowerCase();const lang=raw.startsWith('id')?'id':raw.startsWith('es')?'es':raw.startsWith('pt')?'pt':raw.startsWith('fr')?'fr':raw.startsWith('de')?'de':raw.startsWith('ja')?'ja':raw.startsWith('ko')?'ko':raw.startsWith('zh')?'zh':raw.startsWith('ru')?'ru':raw.startsWith('hi')?'hi':raw.startsWith('ar')?'ar':raw.startsWith('vi')?'vi':raw.startsWith('th')?'th':raw.startsWith('pl')?'pl':raw.startsWith('it')?'it':raw.startsWith('tr')?'tr':raw.startsWith('fil')?'fil':'en';const msg={id:'Script tidak ditemukan.',en:'Script not found.',es:'Script no encontrado.',pt:'Script não encontrado.',fr:'Script introuvable.',de:'Script nicht gefunden.',ja:'スクリプトが見つかりません。',ko:'스크립트를 찾을 수 없습니다.',zh:'找不到脚本。',ru:'Скрипт не найден.',hi:'Script नहीं मिला।',ar:'لم يتم العثور على السكربت.',vi:'Không tìm thấy script.',th:'ไม่พบสคริปต์',pl:'Nie znaleziono skryptu.',it:'Script non trovato.',tr:'Script bulunamadı.',fil:'Hindi nahanap ang script.'}[lang]||'Script not found.';const sb=window.supabase.createClient(window.CB_SUPABASE_URL,window.CB_SUPABASE_ANON_KEY);const id=new URLSearchParams(location.search).get('id');const out=document.getElementById('code');if(!id){out.textContent=msg;return}const {data,error}=await sb.from('scripts').select('code,filename').eq('id',id).eq('visibility','public').maybeSingle();if(error||!data){out.textContent=msg;return}document.title=data.filename+' — CB ScriptStore Raw';out.textContent=data.code;})();</script></body></html>
