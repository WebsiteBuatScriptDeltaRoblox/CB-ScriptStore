<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CB ScriptStore Raw</title>
  <style>body{margin:0;background:#070b14;color:#dce8ff;font-family:system-ui,sans-serif}pre{white-space:pre-wrap;word-break:break-word;padding:24px;margin:0;line-height:1.55;font:14px/1.55 ui-monospace,SFMono-Regular,Consolas,monospace}</style>
</head>
<body><pre id="code">Loading...</pre>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
const sb=supabase.createClient(window.CB_SUPABASE_URL,window.CB_SUPABASE_ANON_KEY);
const id=new URLSearchParams(location.search).get('id');
const out=document.getElementById('code');
(async()=>{
  if(!id){out.textContent='Script tidak ditemukan.';return;}
  const {data,error}=await sb.from('scripts').select('code,filename,visibility').eq('id',id).eq('visibility','public').maybeSingle();
  if(error||!data){out.textContent='Script tidak ditemukan.';return;}
  document.title=data.filename+' — CB ScriptStore Raw';
  out.textContent=data.code;
})();
</script>
</body></html>
